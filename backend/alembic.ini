# Alembic reads the connection from app.config (DB_* settings), not from a
# sqlalchemy.url here, so the RDS secret lookup in app/db.py applies to
# migrations too.
#
#   alembic upgrade head                     apply pending revisions
#   alembic revision --autogenerate -m "..." draft a revision from app/models.py
#   alembic check                            fail if models and revisions drift

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
