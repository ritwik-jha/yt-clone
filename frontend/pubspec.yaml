name: ytp_app
description: "Video Stream web app: browse, watch, and upload videos."
# Private app, never published to pub.dev.
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.13.5

# Web only. Browser APIs (video element, file input, XHR uploads) come from
# package:web; nothing here may need a native plugin.
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  dio: ^5.11.1
  go_router: ^17.0.0
  intl: ^0.20.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  fake_async: ^1.3.3
  mocktail: ^1.0.5
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
